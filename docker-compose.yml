version: '3'

services:
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - bigdata-net

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode-data:/hadoop/dfs/name
    networks:
      - bigdata-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    env_file:
      - ./hadoop.env
    depends_on:
      - namenode
    volumes:
      - datanode-data:/hadoop/dfs/data
    networks:
      - bigdata-net

  hbase-master:
    image: bde2020/hbase-master:1.0.0-hbase1.2.6
    container_name: hbase-master
    depends_on:
      - zookeeper
      - namenode
      - datanode
    ports:
      - "16000:16000"
      - "16010:16010"
    environment:
      - ZK_QUORUM=zookeeper
    networks:
      - bigdata-net

  hbase-regionserver:
    image: bde2020/hbase-regionserver:1.0.0-hbase1.2.6
    container_name: hbase-regionserver
    depends_on:
      - hbase-master
    ports:
      - "16020:16020"
      - "16030:16030"
    environment:
      - ZK_QUORUM=zookeeper
    networks:
      - bigdata-net

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    env_file:
      - ./hadoop.env
    environment:
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: "jdbc:postgresql://hive-metastore/metastore"
      SERVICE_PRECONDITION: "hive-metastore:9083"
    ports:
      - "10000:10000"
    depends_on:
      - namenode
      - datanode
      - hive-metastore
    networks:
      - bigdata-net

  hive-metastore-db:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-db
    networks:
      - bigdata-net

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    env_file:
      - ./hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_PRECONDITION: "namenode:9870 hive-metastore-db:5432"
    ports:
      - "9083:9083"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db
    networks:
      - bigdata-net

  spark-master:
    image: bitnami/spark:3.3
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker:
    image: bitnami/spark:3.3
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - bigdata-net

  jobmanager:
    image: flink:1.17
    container_name: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks:
      - bigdata-net

  taskmanager:
    image: flink:1.17
    container_name: taskmanager
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - bigdata-net

  ingestao:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ingestao
    depends_on:
      - namenode
      - datanode
      - jobmanager
    volumes:
      - ./gerador:/app/gerador
      - ./flume:/app/flume
      - ./streaming:/app/streaming
      - ./batch:/app/batch
    networks:
      - bigdata-net
    command: tail -f /dev/null

networks:
  bigdata-net:
    driver: bridge

volumes:
  namenode-data:
  datanode-data:
