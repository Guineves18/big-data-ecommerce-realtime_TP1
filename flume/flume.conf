# flume.conf: Um agente chamado a1

# Nomeando os componentes do agente
a1.sources = r1
a1.sinks = k1 k2
a1.channels = c1 c2

# Configurando o Source (Lendo o log do gerador)
a1.sources.r1.type = exec
a1.sources.r1.command = tail -F /app/gerador/ecommerce_events.log
a1.sources.r1.channels = c1 c2

# Interceptor para adicionar timestamp (necessário para o HDFS sink agrupar por data)
a1.sources.r1.interceptors = i1
a1.sources.r1.interceptors.i1.type = timestamp

# Configurando o HDFS Sink (Gravação em lote para o Spark)
a1.sinks.k1.type = hdfs
a1.sinks.k1.channel = c1
a1.sinks.k1.hdfs.path = hdfs://namenode:9000/ecommerce/raw/%Y-%m-%d
a1.sinks.k1.hdfs.filePrefix = events
a1.sinks.k1.hdfs.fileSuffix = .json
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.writeFormat = Text
a1.sinks.k1.hdfs.rollInterval = 60
a1.sinks.k1.hdfs.rollSize = 0
a1.sinks.k1.hdfs.rollCount = 0

# Configurando o Sink de Teste/Streaming (Logger)
# Nota: Para integrar com Flink sem Kafka, a abordagem mais comum é o Flink ler o diretório do HDFS em modo streaming (watch),
# ou usar um sink customizado. Aqui usamos logger como teste inicial.
a1.sinks.k2.type = logger
a1.sinks.k2.channel = c2

# Configurando os Canais na memória
a1.channels.c1.type = memory
a1.channels.c1.capacity = 10000
a1.channels.c1.transactionCapacity = 1000

a1.channels.c2.type = memory
a1.channels.c2.capacity = 10000
a1.channels.c2.transactionCapacity = 1000
